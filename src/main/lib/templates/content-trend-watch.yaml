id: content-trend-watch
stage: content
stage_family: understand
recommended_next:
  - content-post-calendar
emoji: "\U0001F4E1"
headline: Track trends and turn them into a usable trend digest
how: Search news, Reddit, X/Twitter, blogs, and research papers with configurable timeframe and sources, then condense into a trend digest.
input: Topic description with optional search preferences (timeframe, sources, focus areas)
output: Trend digest with named themes, signals, and why they matter
use_when: You need a current evidence base before generating a concrete post plan or drafting posts.
time: ~6-8 min.
steps:
  - Parse search preferences from input (timeframe, sources, focus)
  - Search selected sources in parallel using Exa (news, tweets, blogs, research) and Serper (reddit)
  - Synthesize results into a structured trend digest with themes, signals, and sources
  - Evaluate digest quality for evidence backing, specificity, and niche coverage
pack:
  id: content-factory-alpha
  label: Content Lab
  journey_stage: research
  entrypoint: true
  recommended_next:
    - content-post-calendar
suggested_tools:
  - web_search
  - exa
  - serper
contract_out:
  - kind: trend_digest
    title: Trend Digest
    description: Current themes, signals, and emerging angles worth turning into content.
execution_policy:
  profile_id: content_trend_watch
  summary: Evidence-first trend watch
  description: Start from signals and observations before turning them into ideas or drafts.
  tags:
    - evidence_first
    - consistency_checks
  notes:
    - Prefer concrete signals over vague “hot takes.”
    - Make the evidence base usable for downstream ideation.
    - “Target operator: solo founder with AI agents, no employees. Filter recommendations by what one person can execute with AI tools within a week. Avoid team-dependent suggestions.”
version: 1
name: "Content Lab: Trend Watch"
description: Turn incoming research into a trend digest that can seed a content campaign.
defaults:
  model: sonnet
  maxTurns: 120
  timeout_minutes: 25
nodes:
  - id: input-1
    type: input
    position:
      x: 0
      y: 200
    config:
      inputType: text
      required: true
      placeholder: "Describe the topic and search preferences. Example: 'AI agent orchestration — last 7 days, news + reddit, focus on launches and pricing changes'"
  - id: trend-watch-1
    type: skill
    position:
      x: 320
      y: 200
    config:
      skillRef: researcher
      prompt: >-
        Build a Trend Digest by actively searching for signals.

        STEP 1 — Parse the user input for search preferences:
        - Topic/keywords (required)
        - Timeframe: look for "last N days/hours/week" → use maxAgeHours parameter.
          Default: 168 hours (7 days) if not specified.
        - Sources requested: "news", "reddit", "twitter/X", "blogs", "research".
          Default: news + reddit if not specified.
        - Focus: "launches", "pricing", "controversies", "opinions", etc.

        STEP 2 — Search using available tools based on requested sources:

        NEWS (via Exa): use web_search_advanced_exa with:
        - category: "news" for press coverage and announcements
        - maxAgeHours: from user preference (default 168)
        - numResults: 30
        - enableHighlights: true, highlightsQuery: the user's topic
        - type: "neural" for semantic matching

        REDDIT (via Serper or Exa): search site:reddit.com for the topic,
        scrape top threads, extract top-scored comments as community signals.

        X/TWITTER (via Exa): use web_search_advanced_exa with
        category "tweet" to find recent discussions and opinions.

        BLOGS/PERSONAL (via Exa): use category "personal site" for
        independent analysis and contrarian takes.

        RESEARCH (via Exa): use category "research paper" for
        academic signals if the user requests it.

        Only search the sources the user asked for, or default to news + reddit.

        STEP 3 — Synthesize into a structured digest:
        - Major themes (with source links and dates)
        - Specific signals backed by quotes, scores, or engagement data
        - What feels newly important vs continuing trends
        - Contrarian or under-covered angles
        - What these signals suggest for future content or action

        Keep the output structured, concise, and ready to feed into
        an idea backlog or content calendar. Cite sources with dates.
  - id: eval-1
    type: evaluator
    position:
      x: 640
      y: 200
    config:
      criteria: "Score 1-10: digest is structured with named themes, has real source links or citations (not invented), covers the topic from the user request. Do NOT re-search or re-scrape — only evaluate the text quality of the existing output."
      threshold: 5
      maxRetries: 1
      retryFrom: trend-watch-1
  - id: output-1
    type: output
    position:
      x: 960
      y: 200
    config:
      title: Trend Digest
edges:
  - id: e-input-trend-watch
    source: input-1
    target: trend-watch-1
    type: default
  - id: e-trend-watch-eval
    source: trend-watch-1
    target: eval-1
    type: default
  - id: e-eval-output
    source: eval-1
    target: output-1
    type: pass
  - id: e-eval-retry
    source: eval-1
    target: trend-watch-1
    type: fail
