id: content-trend-watch
stage: content
stage_family: understand
recommended_next:
  - content-post-drafter
emoji: "\U0001F4E1"
headline: Track trends and turn them into a usable trend digest
how: Split input topics, research each in parallel, merge into a combined trend digest.
input: One or more topics — comma-separated or one per line
output: Combined trend digest with named themes, signals, and why they matter
use_when: You need a current evidence base before generating a concrete post plan or drafting posts.
time: ~6-12 min.
steps:
  - Split the input into individual topics
  - Research each topic in parallel — news, Reddit, blogs via Exa and Serper
  - Merge all topic digests into one combined report
  - Evaluate digest quality for evidence backing, specificity, and niche coverage
pack:
  id: content-factory-alpha
  label: Content Lab
  journey_stage: research
  entrypoint: true
  recommended_next:
    - content-post-drafter
suggested_tools:
  - web_search
  - exa
  - serper
contract_out:
  - kind: trend_digest
    title: Trend Digest
    description: Current themes, signals, and emerging angles worth turning into content.
execution_policy:
  profile_id: content_trend_watch
  summary: Evidence-first trend watch
  description: Start from signals and observations before turning them into ideas or drafts.
  tags:
    - evidence_first
    - consistency_checks
    - parallel_split
  notes:
    - Prefer concrete signals over vague "hot takes."
    - Make the evidence base usable for downstream ideation.
    - "Target operator: solo founder with AI agents, no employees. Filter recommendations by what one person can execute with AI tools within a week. Avoid team-dependent suggestions."
version: 1
name: "Content Lab: Trend Watch"
description: Turn incoming research into a trend digest that can seed a content campaign. Supports multiple topics in parallel.
defaults:
  model: sonnet
  maxTurns: 120
  timeout_minutes: 25
nodes:
  - id: input-1
    type: input
    position:
      x: 0
      y: 200
    config:
      inputType: text
      required: true
      placeholder: "List topics to research — one per line or comma-separated. Example: 'openclaw, claude code, harness'"
  - id: splitter-1
    type: splitter
    position:
      x: 280
      y: 200
    config:
      strategy: decompose
      maxBranches: 10
  - id: trend-watch-1
    type: skill
    position:
      x: 560
      y: 200
    config:
      skillRef: researcher
      prompt: >-
        Build a Trend Digest for this topic by actively searching for signals.

        1. UNDERSTAND THE TOPIC — extract keywords, timeframe (default: last 7 days),
        and any focus the user specified (launches, pricing, community sentiment, etc.).

        2. SEARCH BROADLY — use every available search tool to cover the topic
        from multiple angles. Combine tools if several are available:
        - News and press coverage
        - Community discussions (Reddit, forums)
        - Social posts and opinions (X/Twitter)
        - Independent blogs and personal analysis
        - Academic or research papers (if relevant to the topic)
        Run multiple searches with different queries to maximize coverage.
        Prefer recent results — use time-bounded searches when supported.

        3. SYNTHESIZE — structure findings into a digest:
        - Major themes (with source links and dates)
        - Specific signals backed by quotes, data, or engagement metrics
        - What feels newly important vs continuing trends
        - Contrarian or under-covered angles
        - What these signals suggest for future content or action

        Keep the output structured, evidence-backed, and ready to feed
        into downstream drafting. Cite sources with dates.
  - id: merger-1
    type: merger
    position:
      x: 840
      y: 200
    config:
      strategy: concatenate
  - id: eval-1
    type: evaluator
    position:
      x: 1120
      y: 200
    config:
      criteria: "Score 1-10: digest is structured with named themes, has real source links or citations (not invented), covers the topics from the user request. Do NOT re-search or re-scrape — only evaluate the text quality of the existing output."
      threshold: 5
      maxRetries: 0
      retryFrom: merger-1
  - id: output-1
    type: output
    position:
      x: 1400
      y: 200
    config:
      title: Trend Digest
edges:
  - id: e-input-splitter
    source: input-1
    target: splitter-1
    type: default
  - id: e-splitter-researcher
    source: splitter-1
    target: trend-watch-1
    type: default
  - id: e-researcher-merger
    source: trend-watch-1
    target: merger-1
    type: default
  - id: e-merger-eval
    source: merger-1
    target: eval-1
    type: default
  - id: e-eval-output
    source: eval-1
    target: output-1
    type: pass
  - id: e-eval-retry
    source: eval-1
    target: merger-1
    type: fail
