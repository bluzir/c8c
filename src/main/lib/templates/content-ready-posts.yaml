id: content-ready-posts
stage: content
stage_family: deliver
recommended_next: []
emoji: "\U0001F4DD"
headline: Turn an approved draft into ready-to-publish posts
how: Apply the approved QA guidance, finalize the copy, and hand back a publish-ready bundle.
input: Approved draft, QA report, and channel constraints
output: Ready posts bundle prepared for publishing or scheduling
use_when: A draft has passed QA and you want the final publish-ready version bundled cleanly.
time: ~6-8 min.
steps:
  - Apply the approved QA edits to the draft
  - Finalize the publish-ready copy and packaging notes
  - Hold a final human publish approval before output
pack:
  id: content-factory-alpha
  label: Content Lab
  journey_stage: deliver
contract_in:
  - kind: draft
    title: Draft Post
    description: The approved draft that should be finalized into a publish-ready bundle.
    required: true
  - kind: qa_report
    title: QA Report
    description: Approved review guidance that should be applied before publishing.
    required: true
suggested_tools: []
contract_out:
  - kind: distribution_bundle
    title: Ready Posts
    description: Final post bundle ready for publishing or scheduling.
execution_policy:
  profile_id: content_ready_posts
  summary: Publish-gated finalization
  description: Finalize an approved draft into a publish-ready bundle while keeping the last human checkpoint visible.
  tags:
    - voice_locked
    - no_slop
    - critique_loops
    - publish_gate
  notes:
    - Posts should feel specific and current, not generic AI filler.
    - Keep format consistent with the intended publishing channel.
    - Require a human checkpoint before calling the bundle done.
version: 1
name: "Content Lab: Ready Posts"
description: Turn an approved draft and QA report into ready-to-publish posts with a final publish gate.
defaults:
  model: sonnet
  maxTurns: 150
  timeout_minutes: 30
nodes:
  - id: input-1
    type: input
    position:
      x: 0
      y: 200
    config:
      inputType: text
      required: true
      placeholder: Paste the approved draft, QA report, channel rules, and any final publishing constraints.
  - id: drafter-1
    type: skill
    position:
      x: 320
      y: 200
    config:
      skillRef: writer
      prompt: >-
        Use the Approved Draft and QA Report to finalize a Ready Posts bundle.
        Produce:
        1) the final publish-ready copy,
        2) the key edits or fixes applied from QA,
        3) any optional publishing or scheduling note,
        4) any unresolved risk that still needs human attention.
        Keep the copy specific, on-voice, and aligned with the requested channel constraints.
        Do not reinvent the thesis; tighten and finalize the approved draft.
  - id: eval-1
    type: evaluator
    position:
      x: 640
      y: 200
    config:
      criteria: "Score 1-10: QA issues are addressed, tone remains consistent, copy is specific and not generic, and output is publish-ready for the stated channel."
      threshold: 7
      maxRetries: 2
      retryFrom: drafter-1
  - id: approval-1
    type: approval
    position:
      x: 960
      y: 200
    config:
      message: Approve the final ready-posts bundle before it is treated as publish-ready.
      show_content: true
      allow_edit: true
      timeout_minutes: 180
      timeout_action: skip
  - id: output-1
    type: output
    position:
      x: 1280
      y: 200
    config:
      title: Ready Posts
edges:
  - id: e-input-drafter
    source: input-1
    target: drafter-1
    type: default
  - id: e-drafter-eval
    source: drafter-1
    target: eval-1
    type: default
  - id: e-eval-approval
    source: eval-1
    target: approval-1
    type: pass
  - id: e-eval-retry
    source: eval-1
    target: drafter-1
    type: fail
  - id: e-approval-output
    source: approval-1
    target: output-1
    type: default
