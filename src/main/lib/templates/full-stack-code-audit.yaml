id: full-stack-code-audit
stage: code
stage_family: evaluate
emoji: "\U0001F6E1"
headline: Audit a codebase across security, quality, and architecture
how: Maps the project, fans out repo-wide audit tracks across core engineering lenses, and merges findings into one prioritized report
input: A project directory or repository path with the codebase to audit
output: Repo-wide audit report covering security, code quality, architecture, and test coverage
use_when: Your codebase grew and you need one deep pass across the real risks, not a surface-level summary.
time: ~10-15 min.
steps:
  - Map the project across code, runtime, and test surfaces
  - Fan out repo-wide audit tracks by engineering lens
  - Review each lens in parallel against the full codebase
  - Synthesize findings into a prioritized audit report
execution_policy:
  profile_id: solo_operator
  summary: Solo founder operational context
  notes:
    - "Target operator: solo founder with AI agents, no employees. Filter recommendations by what one person can execute with AI tools within a week. Avoid team-dependent suggestions."
version: 1
name: Full-Stack Code Audit
description:
  Map the full project, audit the entire codebase through security, quality, architecture,
  and test lenses, then produce one prioritized report
defaults:
  model: sonnet
  maxTurns: 120
  timeout_minutes: 45
  maxParallel: 4
  permissionMode: plan
nodes:
  - id: input-1
    type: input
    position:
      x: 0
      y: 200
    config:
      inputType: directory
      required: true
      placeholder: /path/to/project
  - id: mapper-1
    type: skill
    position:
      x: 280
      y: 200
    config:
      prompt: >-
        Inspect the entire project in the current working directory and create a concise but comprehensive audit map.
        Identify the main product/runtime surfaces, architectural modules, trust and data boundaries, major configs and
        scripts, test surfaces, and representative high-risk files or directories. Output markdown with sections:
        System Overview, Product and Runtime Surfaces, Trust and Data Boundaries, Quality and Test Surfaces, Tooling and
        Delivery Surfaces, and Representative File Paths. Do not audit or recommend fixes yet.
  - id: splitter-1
    type: splitter
    position:
      x: 560
      y: 200
    config:
      strategy: |-
        From the project map, create exactly 4 parallel repo-wide audit tasks. Each task must inspect the ENTIRE
        project from one audit lens:
        1) security, auth, secrets, trust boundaries, and input validation
        2) code quality, complexity, consistency, and maintainability
        3) architecture, module boundaries, dependencies, and scalability risks
        4) test coverage, assertion quality, and verification gaps

        Each task must be fully self-contained and include:
        - lens name
        - what to inspect across the whole codebase
        - representative modules/files from the project map
        - what good looks like for that lens
        Avoid overlap where possible, but keep every task grounded in the full project.
      maxBranches: 4
  - id: auditor-1
    type: skill
    position:
      x: 860
      y: 200
    config:
      skillRef: dev/code-reviewer
      prompt: >-
        Using the assigned audit task and the current working directory, audit the ENTIRE project from this lens.
        Inspect actual code, configs, scripts, dependencies, tests, and runtime surfaces. Do not edit files. Output a
        structured markdown report with sections: Lens Summary, Findings, and Recommendations. Every finding must
        include severity (critical/high/medium/low), engineering or product impact, evidence with file paths and line
        numbers when possible, and a concrete fix recommendation.
  - id: merger-1
    type: merger
    position:
      x: 1160
      y: 200
    config:
      strategy: summarize
      prompt: |-
        Merge the branch outputs into one full-stack code audit report for the whole project.

        Structure the report as:
        - Executive summary
        - Overall health scorecard by lens
        - Critical issues first, then high/medium/low findings
        - Cross-cutting hotspots seen in multiple branches
        - Prioritized remediation roadmap: now / next / later
        - File, module, and workflow hotspots

        Deduplicate overlaps, preserve concrete evidence, and keep the report directly actionable.
        Prefix the markdown with YAML frontmatter under diagnostic_summary containing: headline, tone
        (danger|warning|neutral), severity_counts, and 2-4 top_findings with id, label, detail, and severity.
  - id: evaluator-1
    type: evaluator
    position:
      x: 1460
      y: 200
    config:
      criteria: >-
        Score 1-10 on: (1) full-project coverage across security, quality, architecture, and test surfaces, (2)
        specificity of evidence with file or line references, (3) severity accuracy and prioritization, (4)
        actionability of fixes, and (5) usefulness of the final report as an audit backlog. Fail if the report is
        generic, misses major codebase surfaces, or lacks concrete evidence.
      threshold: 7
      maxRetries: 2
      retryFrom: splitter-1
  - id: approval-1
    type: approval
    position:
      x: 1760
      y: 200
    config:
      message: Check the audit findings. Mark any false positives or known trade-offs before the system generates fix recommendations.
      show_content: true
      allow_edit: true
      timeout_minutes: 120
      timeout_action: auto_reject
  - id: report-1
    type: skill
    position:
      x: 2060
      y: 200
    config:
      prompt: >-
        Output as structured markdown with clear sections, not a presentation. Include: overall health score,
        findings by category, top 10 critical issues, and a remediation roadmap with estimated effort.
  - id: output-1
    type: output
    position:
      x: 2360
      y: 200
    config:
      title: Full-Stack Audit Report
      format: markdown
edges:
  - id: e-input-mapper
    source: input-1
    target: mapper-1
    type: default
  - id: e-mapper-splitter
    source: mapper-1
    target: splitter-1
    type: default
  - id: e-splitter-auditor
    source: splitter-1
    target: auditor-1
    type: default
  - id: e-auditor-merger
    source: auditor-1
    target: merger-1
    type: default
  - id: e-merger-evaluator
    source: merger-1
    target: evaluator-1
    type: default
  - id: e-evaluator-approval
    source: evaluator-1
    target: approval-1
    type: pass
  - id: e-evaluator-splitter
    source: evaluator-1
    target: splitter-1
    type: fail
  - id: e-approval-report
    source: approval-1
    target: report-1
    type: default
  - id: e-report-output
    source: report-1
    target: output-1
    type: default
