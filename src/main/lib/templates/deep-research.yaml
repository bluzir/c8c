id: deep-research
stage: research
stage_family: understand
recommended_next: []
emoji: "\U0001F50D"
headline: Research any topic from multiple angles
how: Decomposes a topic into lenses, investigates each separately, then synthesizes a structured report
input: A topic or research question
output: Structured research report with executive summary, findings per angle, and practical conclusions
use_when: You need grounded evidence before making a decision, not a single-pass summary.
time: ~8-12 min.
steps:
  - Decompose topic into 4-6 research lenses with key questions
  - Fan out parallel investigation per lens
  - Synthesize findings into a comprehensive report
  - Evaluate evidence quality, disconfirming coverage, and source specificity
suggested_tools:
  - web_search
  - exa
  - serper
contract_out:
  - kind: research_pack
    title: Research Pack
    description: Multi-angle findings, source-grounded evidence, and practical takeaways for the question.
  - kind: decision_record
    title: Decision Record
    description: Executive summary, options, and implications distilled from the research.
version: 1
name: Deep Research
description:
  Plan a topic via multi-angle decomposition and KAC, investigate each aspect separately, synthesize into a
  structured report
defaults:
  model: sonnet
  maxTurns: 120
  timeout_minutes: 30
nodes:
  - id: input-1
    type: input
    position:
      x: 0
      y: 200
    config: {}
  - id: decomposition-1
    type: skill
    position:
      x: 250
      y: 200
    config:
      skillRef: researcher
      prompt:
        "Create a QUICK decomposition plan — do NOT research yet, only plan. Return ONLY a JSON array (no markdown, no
        explanation) where each aspect has: name, lens, key_question, why_it_matters, priority (high|medium), and
        query_seeds (3-4 search queries). Cover 4-6 distinct lenses, avoid overlap. Add 1-2 KAC (Key Assumptions Check)
        aspects that try to disprove hidden assumptions. This step should take under 30 seconds — just think and output
        the plan JSON. Do NOT call any search tools."
  - id: splitter-1
    type: splitter
    position:
      x: 650
      y: 200
    config:
      strategy:
        The input is a JSON array of research aspects. Create exactly ONE branch per JSON object in the array.
        Each branch content must be the full JSON object for that aspect (name, lens, key_question, query_seeds).
        Do NOT split within an aspect. Do NOT split by sentences or table rows. One aspect = one branch.
      maxBranches: 8
  - id: researcher-1
    type: skill
    position:
      x: 950
      y: 200
    config:
      skillRef: researcher
      prompt: >-
        Research this aspect thoroughly using ALL available sources in parallel:
        1) WEB (via Exa or web search): articles, blogs, reports, expert analysis.
        2) REDDIT (via Serper): search site:reddit.com for community insights,
        scrape top threads with includeMarkdown=true, extract scored comments.
        3) X/TWITTER (via Exa): category "tweet" for recent discussions and opinions.
        Find credible sources, key data points, expert opinions, and emerging trends.
        Prioritize primary sources and recent publications. Cite Reddit scores and
        tweet engagement where available. For KAC/assumption-check aspects, prioritize
        disconfirming evidence, failure cases, and counter-examples.
  - id: merger-1
    type: merger
    position:
      x: 1250
      y: 200
    config:
      strategy: summarize
      prompt:
        Synthesize all research findings into a comprehensive, well-structured report. Include an executive summary, key
        findings per aspect, KAC outcomes (which assumptions held or failed), cross-cutting themes, and actionable
        conclusions.
  - id: eval-1
    type: evaluator
    position:
      x: 1570
      y: 200
    config:
      criteria: "Score 1-10: report covers multiple aspects with concrete evidence, sources are cited, no speculative conclusions presented as facts. Do NOT re-research — only evaluate the written report."
      threshold: 5
      maxRetries: 1
      retryFrom: merger-1
  - id: output-1
    type: output
    position:
      x: 1890
      y: 200
    config: {}
edges:
  - id: e-input-decomposition
    source: input-1
    target: decomposition-1
    type: default
  - id: e-decomposition-splitter
    source: decomposition-1
    target: splitter-1
    type: default
  - id: e-splitter-researcher
    source: splitter-1
    target: researcher-1
    type: default
  - id: e-researcher-merger
    source: researcher-1
    target: merger-1
    type: default
  - id: e-merger-eval
    source: merger-1
    target: eval-1
    type: default
  - id: e-eval-output
    source: eval-1
    target: output-1
    type: pass
  - id: e-eval-retry
    source: eval-1
    target: splitter-1
    type: fail
execution_policy:
  profile_id: solo-founder
  summary: Optimized for solo founders using AI agents
  notes:
    - "Target operator: solo founder with AI agents, no employees. Filter recommendations by what one person can execute with AI tools within a week. Avoid team-dependent suggestions."
